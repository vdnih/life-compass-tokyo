<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="制度を知って、自分の人生を自分で描く。結婚・妊娠・出産・子育てとキャリアを一つの時間軸で考え直せるタイムラインアプリ。">

  <!-- Open Graph / LINE / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://my-career-app-559fd.web.app/">
  <meta property="og:site_name" content="ライフコンパス東京">
  <meta property="og:title" content="ライフコンパス東京 | 制度を知って、自分の人生を自分で描く">
  <meta property="og:description" content="制度を知って、自分の人生を自分で描く。結婚・妊娠・出産・子育てとキャリアを一つの時間軸で考え直せるタイムラインアプリ。">
  <meta property="og:image" content="https://my-career-app-559fd.web.app/og-image.png">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="900">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ライフコンパス東京 | 制度を知って、自分の人生を自分で描く">
  <meta name="twitter:description" content="制度を知って、自分の人生を自分で描く。結婚・妊娠・出産・子育てとキャリアを一つの時間軸で考え直せるタイムラインアプリ。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ライフコンパス東京">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>

  <title>ライフコンパス東京 | 制度を知って、自分の人生を自分で描く</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Firebase Auth Emulator が接続時に自動挿入する警告バナー（.firebase-emulator-warning）を
    非表示にする。Dart側の useAuthEmulator() はJS SDKの disableWarnings オプションを
    公開していないため、CSSで抑制する以外に手段が無い。エミュレータ接続時（開発時）
    にしか出現しない要素なので、本番ビルド（常に本番Firebaseへ接続、ADR-024）には影響しない。
  -->
  <style>
    .firebase-emulator-warning {
      display: none !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
